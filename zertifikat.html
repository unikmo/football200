<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Football200 Sponsor-Zertifikat</title><link rel="stylesheet" href="/premium.css"><style>body{background:#f6f5f1}.wrap{max-width:980px;margin:50px auto;padding:0 22px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.paper{background:#fffdf8;border:1px solid #d8d1c4;box-shadow:0 22px 50px rgba(15,23,34,.12);padding:64px;min-height:590px;position:relative;text-align:center}.paper:before{content:"";position:absolute;inset:18px;border:1px solid #d8cfbf}.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#72706b}.level{font-family:Georgia,"Times New Roman",serif;font-size:46px;margin:28px 0 14px}.company{font-size:28px;font-weight:800}.city{color:#65717d;margin-top:6px}.support{margin:34px auto 0;max-width:560px;padding-top:24px;border-top:1px solid #e4ded4;font-size:18px;line-height:1.5}.sign{margin-top:70px;font-family:"Segoe Script","Brush Script MT",cursive;font-size:28px}.board{font-size:12px;color:#65717d}.error{padding:40px;text-align:center;color:#b42318}@media print{.toolbar,.demo-bar{display:none}.wrap{margin:0;max-width:none;padding:0}.paper{box-shadow:none;border:0;min-height:100vh}}</style></head><body><div class="demo-bar">Digitales Football200 Zertifikat</div><main class="wrap"><div class="toolbar"><a class="btn btn-outline" href="/unternehmen.html">Sponsor a Young Fan</a><button class="btn btn-primary" onclick="window.print()">Drucken / als PDF speichern</button></div><section id="paper" class="paper" aria-live="polite"><p>Laden …</p></section></main><script>
const id=new URLSearchParams(location.search).get('id'),paper=document.querySelector('#paper');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const r=await fetch('/api/certificates/public?id='+encodeURIComponent(id||''));const b=await r.json();if(!r.ok||!b.certificate)throw new Error();const c=b.certificate;const children=Number(c.children)||0;paper.innerHTML=`<div class="k">Sponsor Zertifikat</div><div class="level">${esc(c.levelName||'')}</div><div class="company">${esc(c.company||'')}</div><div class="city">${esc(c.city||'')}</div><div class="support"><strong>Unterstützt ${children} ${children===1?'jungen Fan':'junge Fans'}</strong><br>${esc(c.clubName||'')}<br>Saison ${esc(c.season||'')}</div><div class="sign">Football200</div><div class="board">Football200 Vorstand</div>`}catch{paper.innerHTML='<div class="error"><strong>Zertifikat nicht gefunden.</strong><br>Bitte prüfen Sie den Link.</div>'}}load();
</script></body></html>

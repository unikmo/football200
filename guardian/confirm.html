<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teilnahme bestätigen | Football200</title><link rel="stylesheet" href="/premium.css"><style>.wrap{max-width:700px;margin:60px auto;padding:0 24px}.box{border:1px solid #e4e8e2;border-radius:22px;padding:28px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;height:44px;border:1px solid #dfe3df;border-radius:10px;padding:0 10px}.check{display:flex;gap:9px;font-size:13px}</style></head><body><div class="demo-bar">Guardian confirmation · synthetic Preview</div><main class="wrap"><div class="kicker">Nach Auswahl</div><h1 class="page-display">Teilnahme bestätigen.</h1><p>Dieser Preview-Flow darf ausschließlich mit synthetischen Testdaten verwendet werden.</p><section class="box"><div class="field"><label>Test-Erziehungsberechtigte Person</label><input id="name"></div><div class="field"><label>E-Mail</label><input id="email" type="email"></div><div class="field"><label>Haushaltsgröße im Standardpass</label><select id="size"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div><label class="check"><input id="consent" type="checkbox"><span>Teilnahmebedingungen im Test-Flow bestätigt.</span></label><button id="submit" class="btn btn-primary" style="margin-top:18px">Bestätigen</button><p id="result"></p></section></main><script>const token=new URL(location.href).searchParams.get('token')||'';document.querySelector('#submit').onclick=async()=>{const r=await fetch('/api/guardian-confirmations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({syntheticTest:true,token,guardianName:document.querySelector('#name').value,email:document.querySelector('#email').value,householdSize:Number(document.querySelector('#size').value),participationConsent:document.querySelector('#consent').checked})});const b=await r.json();document.querySelector('#result').innerHTML=r.ok?`Bestätigt. Pass-Referenz: <strong>${b.passReference}</strong>. ${b.familyPlusEligible?'<a href="/family-plus.html">Family Plus testen →</a>':''}`:`Fehler: ${b.error}`}</script></body></html>

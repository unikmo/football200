<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Medienfreigabe testen | Football200</title><link rel="stylesheet" href="/premium.css"><style>.wrap{max-width:720px;margin:60px auto;padding:0 24px}.box{border:1px solid #e4e8e2;border-radius:22px;padding:28px}.choice{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf0ec}.warn{padding:14px;border-radius:12px;background:#fff3cd;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}</style></head><body><div class="demo-bar">Medienfreigabe · Synthetic Preview</div><main class="wrap"><div class="kicker">Separat & widerrufbar</div><h1 class="page-display">Foto- und Story-Freigabe testen.</h1><div class="warn"><strong>REQUIRES QUALIFIED LEGAL REVIEW.</strong> Dieser Flow darf bis zur rechtlichen Freigabe ausschließlich mit synthetischen Testdaten verwendet werden.</div><section class="box"><label class="choice"><input id="photo" type="checkbox"><span><strong>Foto-Nutzung</strong><br>Bild im Football200-Programmkontext verwenden.</span></label><label class="choice"><input id="story" type="checkbox"><span><strong>Story-Nutzung</strong><br>Kurze Programmerzählung veröffentlichen.</span></label><label class="choice"><input id="sponsor" type="checkbox"><span><strong>Sponsor-Weitergabe</strong><br>Freigegebenes Foto/Story einem Sponsor als Programmartifact zur Verfügung stellen.</span></label><label class="choice"><input id="social" type="checkbox"><span><strong>Social Media</strong><br>Freigegebenes Material in Football200-Social-Kanälen verwenden.</span></label><div class="actions"><button id="save" class="btn btn-primary">Testfreigabe speichern</button><button id="revoke" class="btn btn-outline">Freigabe widerrufen</button></div><p id="result"></p></section></main><script>const token=new URL(location.href).searchParams.get('token')||'';async function submit(revoke){const r=await fetch('/api/media-consent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({syntheticTest:true,token,revoke,photoUse:document.querySelector('#photo').checked,storyUse:document.querySelector('#story').checked,sponsorShare:document.querySelector('#sponsor').checked,socialUse:document.querySelector('#social').checked})});const b=await r.json();document.querySelector('#result').textContent=r.ok?`Status: ${b.status}`:`Fehler: ${b.error}`;}document.querySelector('#save').onclick=()=>submit(false);document.querySelector('#revoke').onclick=()=>submit(true);</script></body></html>

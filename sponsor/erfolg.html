<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sponsoring bestätigt | Football200</title><link rel="stylesheet" href="/premium.css"><style>.wrap{max-width:760px;margin:80px auto;padding:0 24px}.card{border:1px solid #e7e9e8;border-radius:22px;padding:30px;background:#fff}.ok{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#f1f6e6;color:#557b0d;font-size:28px;font-weight:900}.muted{color:#65717d;line-height:1.55}.details{margin:22px 0;border-top:1px solid #e7e9e8}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #eef0ee}.row span{color:#65717d}.row b{text-align:right}</style></head><body><div class="demo-bar">Stripe Test Checkout · Preview only</div><main class="wrap"><div class="card"><div class="ok">✓</div><h1 class="section-title" style="margin-top:18px">Vielen Dank für Ihr Sponsoring.</h1><p id="status" class="muted" role="status" aria-live="polite">Wir bestätigen die Zahlung und erstellen Ihre Football200-Unterlagen …</p><div id="details" class="details" hidden></div><div id="actions" hidden><a id="certificateLink" class="btn btn-primary" href="#">Zertifikat öffnen</a> <a class="btn btn-outline" href="/unternehmen.html">Zur Unternehmensseite</a></div></div></main><script>
const id=new URLSearchParams(location.search).get('session_id');const status=document.querySelector('#status'),details=document.querySelector('#details'),actions=document.querySelector('#actions');let tries=0;
function euro(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function check(){if(!id){status.textContent='Keine Checkout-Sitzung gefunden.';return}tries++;try{const r=await fetch('/api/checkout/status?session_id='+encodeURIComponent(id));const b=await r.json();if(b.fulfilled){const o=b.order;status.textContent=o.certificateStatus==='sent'?'Zahlung bestätigt. Ihr Zertifikat wurde versendet.':'Zahlung bestätigt. Ihr digitales Zertifikat ist erstellt.';details.hidden=false;details.innerHTML=`<div class="row"><span>Bestellung</span><b>${esc(o.orderNumber||'—')}</b></div><div class="row"><span>Unternehmen</span><b>${esc(o.company||'—')}</b></div><div class="row"><span>Verein</span><b>${esc(o.clubName||'—')}</b></div><div class="row"><span>Level</span><b>${esc(o.levelName||'—')}</b></div><div class="row"><span>Betrag</span><b>${euro(Number(o.amount)||0)}</b></div>`;actions.hidden=false;document.querySelector('#certificateLink').href='/zertifikat.html?id='+encodeURIComponent(o.certificateId||'');return}}catch{}if(tries<12)setTimeout(check,2500);else status.textContent='Die Zahlung wurde abgeschlossen. Die Verarbeitung dauert länger als erwartet; bitte prüfen Sie später Ihr Zertifikat bzw. das Admin-Dashboard.'}check();
</script></body></html>

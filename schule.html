<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Schulbewerbung testen | Football200</title><link rel="stylesheet" href="premium.css"><style>.wrap{max-width:760px;margin:60px auto;padding:0 24px}.box{border:1px solid #e4e8e2;border-radius:22px;padding:28px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3df;border-radius:10px;padding:10px}.warn{padding:14px;border-radius:12px;background:#fff3cd;font-size:13px}</style></head><body><div class="demo-bar">Schul-Flow · Synthetic Preview</div><main class="wrap"><div class="kicker">Über teilnehmende Schulen</div><h1 class="page-display">Bewerbung über die Schule testen.</h1><div class="warn"><strong>Nur synthetische Testdaten.</strong> Der reale Schul- und Minderjährigen-Flow bleibt bis Privacy-/Safeguarding-/Legal-Freigabe blockiert.</div><section class="box"><div class="field"><label>Schulcode</label><input id="schoolCode" placeholder="SCH-..."></div><div class="field"><label>Test-Alias</label><input id="alias" placeholder="Testkind-S1"></div><div class="field"><label>Altersband</label><select id="age"><option>9-11</option><option>6-8</option><option>12-14</option><option>15-17</option></select></div><div class="field"><label>Verein</label><select id="club"></select></div><div class="field"><label>Motivation (synthetisch)</label><textarea id="motivation"></textarea></div><button id="submit" class="btn btn-primary">Testbewerbung speichern</button><p id="result"></p></section></main><script>async function init(){const [cr,sr]=await Promise.all([fetch('/api/clubs'),fetch('/api/schools')]),cb=await cr.json(),sb=await sr.json();document.querySelector('#club').innerHTML=(cb.clubs||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');const schools=sb.schools||[];if(schools.length)document.querySelector('#schoolCode').placeholder='Schulcode aus Admin-Schulflow'}document.querySelector('#submit').onclick=async()=>{const r=await fetch('/api/child-applications',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({syntheticTest:true,channel:'school',schoolCode:document.querySelector('#schoolCode').value,applicantAlias:document.querySelector('#alias').value,ageBand:document.querySelector('#age').value,clubId:document.querySelector('#club').value,motivation:document.querySelector('#motivation').value})});const b=await r.json();document.querySelector('#result').textContent=r.ok?`Gespeichert: ${b.id}`:`Fehler: ${b.error}`};init()</script></body></html>

name: Football200 Preview CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'server/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'vercel.json'
      - '**/*.html'
      - '.github/workflows/firebase-preview-ci.yml'
  push:
    branches:
      - firebase-backend-preview
      - firebase-premium-preview
      - admin-operations-preview
      - sponsor-checkout-preview
      - programme-completion-preview

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Release Readiness · Football200 Admin</title><link rel="stylesheet" href="/admin/admin.css"><style>.readiness{max-width:1080px;margin:0 auto;padding:44px 28px}.ready-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.ready-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}.ready-card{border:1px solid #e5e8e5;border-radius:18px;padding:22px;background:white}.ready-card h2{font-size:18px;margin:0 0 14px}.check{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-top:1px solid #eef0ee;font-size:13px}.check:first-of-type{border-top:0}.pill{font-weight:800;font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f3f1}.pill.ok{background:#eef7df;color:#4e7210}.pill.no{background:#fff0ed;color:#9b2c1f}.blockers{margin-top:20px;border:1px solid #f0d9d3;border-radius:18px;padding:22px;background:#fff8f6}.blockers ul{margin:12px 0 0;padding-left:20px;color:#7f352a;line-height:1.7}.go{border-color:#d9e8bb;background:#f7fbef}.go ul{color:#4e7210}@media(max-width:760px){.ready-grid{grid-template-columns:1fr}.ready-head{display:block}}</style></head><body><div class="preview-bar">Football200 · Release Readiness</div><main class="readiness"><div class="ready-head"><div><p class="eyebrow">Release Gate</p><h1>Produktionsbereitschaft</h1><p>Nur nicht-geheime Konfigurations- und Freigabestatus. Ein grüner Code-Build ersetzt keine Live-QA.</p></div><a class="button button-secondary" href="/admin/">Zur Operations Console</a></div><div id="state" aria-live="polite">Status wird geladen …</div></main><script src="/admin/auth.js"></script><script>
function row(label,value){return `<div class="check"><span>${label}</span><span class="pill ${value?'ok':'no'}">${value?'OK':'BLOCKIERT'}</span></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{try{const r=await fetch('/api/health/readiness',{headers:{accept:'application/json'}});const b=await r.json();if(!r.ok||!b.ok)throw new Error(b.error||'READINESS_FAILED');const release=b.release||{},services=b.services||{},stripe=services.stripe||{},email=services.email||{};document.querySelector('#state').innerHTML=`<div class="ready-grid"><section class="ready-card"><h2>Freigaben</h2>${row('Public Release',release.publicReleaseEnabled)}${row('Legal Review',release.legalReleaseApproved)}${row('Payments',release.paymentsReleaseApproved)}${row('Production Operations',release.productionOperationsEnabled)}${row('Minor Data',release.minorDataReleaseApproved)}${row('Distributed Abuse Controls',release.distributedAbuseControlsReady)}${row('Analytics Release',release.analyticsReleaseApproved&&release.analyticsConsentReady)}</section><section class="ready-card"><h2>Dienste</h2>${row('Firebase',services.firebaseConfigured)}${row('Admin Auth',services.adminConfigured)}${row('E-Mail',email.configured)}${row('Stripe Key',stripe.configured)}${row('Stripe Webhook',stripe.webhookConfigured)}${row('Stripe Account Pin',stripe.expectedAccountConfigured)}${row('Shared Abuse Controls',services.distributedAbuseControlsReady)}${row('Analytics Provider',services.analyticsProviderConfigured)}</section></div><section class="blockers ${b.readiness?.productionReady?'go':''}"><h2>${b.readiness?.productionReady?'Technische Gates erfüllt':'Aktuelle Blocker'}</h2><ul>${(b.readiness?.blockers||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Keine gemeldeten Blocker</li>'}</ul></section>`}catch(e){document.querySelector('#state').innerHTML=`<section class="blockers"><h2>Status nicht verfügbar</h2><p>${esc(e.message)}</p></section>`}})();
</script></body></html>

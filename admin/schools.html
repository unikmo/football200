<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Football200 · Schulen</title><link rel="stylesheet" href="/admin/admin.css"><style>.wrap{max-width:900px;margin:50px auto;padding:0 24px}.panel{margin-top:22px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:180px;border:1px solid #dfe3df;border-radius:9px;padding:10px}.card{border:1px solid #e5e8e4;border-radius:14px;padding:14px;margin:10px 0}.small{font-size:12px;color:#65717d}</style><script src="/admin/auth.js"></script></head><body><div class="preview-bar">Football200 Schulen · Synthetic Preview</div><main class="wrap"><a class="button button-secondary" href="/admin/">← Admin</a><h1>Teilnehmende Schulen testen</h1><div class="notice"><strong>Nur synthetische Schulen/Testcodes.</strong> Keine realen Schülerdaten erfassen.</div><section class="panel"><div class="panel-head"><h2>Testschule anlegen</h2></div><div class="row"><input id="name" placeholder="Testschule"><input id="city" placeholder="Ort"><button id="create" class="button">Anlegen</button></div><p id="result" class="small"></p></section><section class="panel"><div class="panel-head"><h2>Schulen</h2></div><div id="list"></div></section></main><script>async function load(){const r=await fetch('/api/admin/schools');const b=await r.json();document.querySelector('#list').innerHTML=(b.schools||[]).map(s=>`<div class="card"><strong>${s.name||''}</strong> · ${s.city||''}<div class="small">Code: ${s.code||''} · Status: ${s.status||''}</div></div>`).join('')||'<p class="small">Noch keine Testschule.</p>'}document.querySelector('#create').onclick=async()=>{const r=await fetch('/api/admin/schools',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,city:document.querySelector('#city').value})});const b=await r.json();document.querySelector('#result').textContent=r.ok?`Angelegt. Code: ${b.code}`:`Fehler: ${b.error}`;if(r.ok)load()};load()</script></body></html>

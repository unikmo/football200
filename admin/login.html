<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Football200 Admin Login</title><link rel="stylesheet" href="/admin/admin.css"><style>.login{max-width:430px;margin:12vh auto;padding:0 24px}.card{border:1px solid #e4e8e2;border-radius:22px;padding:28px;background:white}.card input{width:100%;height:46px;border:1px solid #dfe3df;border-radius:10px;padding:0 12px;margin:12px 0}.error{font-size:13px;color:#b42318}</style></head><body><main class="login"><div class="card"><p class="eyebrow">Football200 Operations</p><h1>Admin Login</h1><p>Single-admin session with an HttpOnly signed cookie.</p><form id="loginForm"><label class="sr-only" for="password">Admin-Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button id="login" class="button" type="submit">Anmelden</button></form><p id="error" class="error" role="alert" aria-live="polite"></p></div></main><script>
function safeNext(){const raw=new URL(location.href).searchParams.get('next')||'/admin/';try{const u=new URL(raw,location.origin);if(u.origin!==location.origin||!u.pathname.startsWith('/admin')||u.pathname.startsWith('//'))return'/admin/';return u.pathname+u.search+u.hash}catch{return'/admin/'}}
document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#login'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const b=await r.json().catch(()=>({}));if(r.ok)return location.replace(safeNext());error.textContent=b.error==='ADMIN_AUTH_NOT_CONFIGURED'?'Admin-Zugang ist noch nicht konfiguriert.':'Anmeldung fehlgeschlagen.'}catch{error.textContent='Anmeldung konnte nicht durchgeführt werden.'}finally{button.disabled=false}});
</script></body></html>

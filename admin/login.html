<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Football200 Admin Login</title><link rel="stylesheet" href="/admin/admin.css"><style>.login{max-width:430px;margin:12vh auto;padding:0 24px}.card{border:1px solid #e4e8e2;border-radius:22px;padding:28px;background:white}.card input{width:100%;height:46px;border:1px solid #dfe3df;border-radius:10px;padding:0 12px;margin:12px 0}.error{font-size:13px;color:#b42318}</style></head><body><main class="login"><div class="card"><p class="eyebrow">Football200 Operations</p><h1>Admin Login</h1><p>Single-admin session with an HttpOnly signed cookie.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="login" class="button" type="button">Anmelden</button><p id="error" class="error"></p></div></main><script>document.querySelector('#login').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const b=await r.json();if(r.ok){const next=new URL(location.href).searchParams.get('next')||'/admin/';location.replace(next)}else document.querySelector('#error').textContent=b.error==='ADMIN_AUTH_NOT_CONFIGURED'?'Admin-Zugang ist noch nicht in Vercel konfiguriert.':'Anmeldung fehlgeschlagen.'}</script></body></html>

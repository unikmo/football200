<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Football200 · Email Delivery</title><link rel="stylesheet" href="/admin/admin.css"><style>.wrap{max-width:850px;margin:50px auto;padding:0 24px}.panel{margin-top:22px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px;border:1px solid #dfe3df;border-radius:9px;padding:10px}</style><script src="/admin/auth.js"></script></head><body><div class="preview-bar">Football200 Email Delivery · Preview</div><main class="wrap"><a class="button button-secondary" href="/admin/">← Admin</a><h1>Email & Zertifikate</h1><section class="panel"><div class="panel-head"><h2>Konfiguration</h2></div><p id="health">Wird geprüft …</p></section><section class="panel"><div class="panel-head"><h2>Zertifikat erneut senden</h2></div><div class="row"><input id="id" placeholder="Certificate ID"><button id="send" class="button">Senden</button></div><p id="result"></p></section></main><script>async function health(){const r=await fetch('/api/admin/email-health');const b=await r.json();document.querySelector('#health').textContent=b.email?.configured?'Resend + Absender sind konfiguriert.':'Email-Zustellung ist noch nicht vollständig konfiguriert.'}document.querySelector('#send').onclick=async()=>{const r=await fetch('/api/admin/certificate-delivery',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({certificateId:document.querySelector('#id').value})});const b=await r.json();document.querySelector('#result').textContent=r.ok?'Zertifikat wurde versendet.':`Nicht versendet: ${b.error||'UNKNOWN'}`};health()</script></body></html>

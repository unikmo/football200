<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Child Application Test | Football200</title><link rel="stylesheet" href="/premium.css"><style>.wrap{max-width:720px;margin:60px auto;padding:0 24px}.box{border:1px solid #e4e8e2;border-radius:22px;padding:28px}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3df;border-radius:10px;padding:10px}.warn{padding:14px;border-radius:12px;background:#fff3cd;font-size:13px}</style></head><body><div class="demo-bar">Synthetic child-flow test · no real child data</div><main class="wrap"><div class="kicker">Preview-only</div><h1 class="page-display">Kinderbewerbung testen.</h1><div class="warn"><strong>Nur synthetische Testdaten.</strong> Keine Namen oder Informationen realer Kinder eingeben.</div><section class="box"><div class="field"><label>Test-Alias</label><input id="alias" placeholder="Testkind-A"></div><div class="field"><label>Altersband</label><select id="age"><option>9-11</option><option>6-8</option><option>12-14</option><option>15-17</option></select></div><div class="field"><label>Verein</label><select id="club"></select></div><div class="field"><label>Motivation (synthetisch)</label><textarea id="motivation"></textarea></div><button id="submit" class="btn btn-primary">Testbewerbung speichern</button><p id="result"></p></section></main><script>async function init(){const r=await fetch('/api/clubs'),b=await r.json();document.querySelector('#club').innerHTML=(b.clubs||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}document.querySelector('#submit').onclick=async()=>{const r=await fetch('/api/child-applications',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({syntheticTest:true,applicantAlias:document.querySelector('#alias').value,ageBand:document.querySelector('#age').value,clubId:document.querySelector('#club').value,channel:'online',motivation:document.querySelector('#motivation').value})});const b=await r.json();document.querySelector('#result').textContent=r.ok?`Gespeichert: ${b.id}`:`Fehler: ${b.error}`};init()</script></body></html>

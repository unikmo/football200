<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Plus bestätigt | Football200</title><link rel="stylesheet" href="/premium.css"></head><body><main style="max-width:760px;margin:80px auto;padding:0 24px"><div class="kicker">Family Plus</div><h1 class="page-display">Zahlung wird bestätigt.</h1><p class="lead" id="status">Wir prüfen den Stripe-Status.</p><a class="btn btn-outline" href="/kinder-familien.html">Zurück zum Programm</a></main><script>const id=new URL(location.href).searchParams.get('session_id');async function poll(){if(!id){document.querySelector('#status').textContent='Keine Session gefunden.';return}for(let i=0;i<12;i++){const r=await fetch('/api/family-plus/status?session_id='+encodeURIComponent(id));const b=await r.json();if(b.paid){document.querySelector('#status').textContent='Family Plus wurde für diese Pass-Referenz bezahlt.';return}await new Promise(x=>setTimeout(x,1200))}document.querySelector('#status').textContent='Die Bestätigung ist noch nicht eingegangen. Bitte später erneut prüfen.'}poll()</script></body></html>
